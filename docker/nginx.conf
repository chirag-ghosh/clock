server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # Always revalidate (cheap 304s via ETag) so a new deploy shows up on the next
  # load. Also stops a CDN's default browser TTL from pinning stale CSS/JS.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri $uri/ /index.html;
  }
}
